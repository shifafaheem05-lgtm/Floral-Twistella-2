name: Daily Facebook & Instagram Post (Floral Twistella)

on:
  schedule:
    # 12:00 UTC = 5:00 PM Pakistan Standard Time (UTC+5, no daylight saving)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Post a specific calendar day (leave empty = next day in the sequence)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: print the post, publish nothing"
        type: boolean
        default: false
      force:
        description: "Post even if something was already posted today"
        type: boolean
        default: false
      only:
        description: "Which platform (use with a day number to re-post one platform only)"
        type: choice
        options: [both, facebook, instagram]
        default: both

# contents: write is needed so the run can save posted_state.json (which day is next)
permissions:
  contents: write

concurrency:
  group: floral-twistella-daily-post
  cancel-in-progress: false

jobs:
  post:
    name: Publish today's post
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository (calendar + media)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate calendar and media files
        run: python post_to_facebook_instagram.py --check

      - name: Post to Facebook & Instagram
        id: post
        continue-on-error: true
        env:
          # accepts your old repo's secret names (PAGE_ID ...) or the new ones (FB_PAGE_ID ...)
          FB_PAGE_ID: ${{ secrets.PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_USER_ID }}
          POST_TIMEZONE: Asia/Karachi
          POST_DAY: ${{ github.event.inputs.day }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_POST: ${{ github.event.inputs.force }}
          POST_ONLY: ${{ github.event.inputs.only }}
          # public media repo (Instagram must download the files from a public link)
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: python post_to_facebook_instagram.py

      - name: Save progress (posted_state.json)
        if: always()
        run: |
          if ! git diff --quiet -- posted_state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_state.json
            git commit -m "chore: update posted state [skip ci]"
            git push
          else
            echo "No progress change to save."
          fi

      - name: Fail the run if posting failed
        if: steps.post.outcome == 'failure'
        run: |
          echo "Posting failed - see the 'Post to Facebook & Instagram' step above."
          exit 1
